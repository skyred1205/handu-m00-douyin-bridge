[project]
name = "handu-m00-bridge"
version = "0.1.0"
description = "HANDU M00 Douyin intake bridge backed by Douyin_TikTok_Download_API"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
